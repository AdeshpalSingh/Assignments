        // Q10. Create a function calculatePercentage(obtained, total) that returns the percentage of marks.

        // Q11. Create a function calculateDiscount(price, discount) that accepts price and discount percentage and returns the discount amount.

        }

        console.log(result)
        // Answer: 100


        // Q12. Create a function finalPrice(price, discount) that returns the price after applying the discount.

        }

        console.log(result)

        // Q13. Create a function celsiusToFahrenheit(celsius) that converts Celsius into Fahrenheit and returns the result.

        // Q15. Create a function getGrade(marks) that returns: 90–100 → "A", 80–89 → "B", 70–79 → "C", 60–69 → "D", Below 60 → "F".

            if(marks>=90 && marks<=100){
                return "A"
            } else if(marks>=80 && marks<=89){
                return "B"
            } else if(marks>=70 && marks<=79){
                return "C"
            } else if(marks>=60 && marks<=69){
                return "D"
            } else{
                marks<=60
                return "F"
            }
        }
