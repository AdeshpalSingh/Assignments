<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>



    <script>
        // Q1. Basic Async Function- 
        // Create an asynchronous function named `welcomeUser()`. 
        // The function should wait for **2 seconds** and then return the following message: 
        // ```text Welcome to JavaScript Async/Await! ``` 
        // Call the function and display the returned message in the console.

        async function welcomeUser() {
            setTimeout(() => {
                console.log("Welcome to JavaScript Async/Await!");
            }, 2000);
        }
        welcomeUser();



    </script>

</body>

</html>
