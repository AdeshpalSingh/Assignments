<body>
    <h1> Simple Calculator</h1>

    <input type="number" id="num1" placeholder="Enter first number">
    <br> <br>
    <input type="number" id="num2" placeholder="Enter second number">
    <br> <br>
    <button onclick="add()">Add</button>
    <button onclick="sub()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>
    <br> <br>
    <button onclick="result()">RESULT </button>


    <script>
        // Q1. Create a simple calculator using HTML, CSS, and JavaScript. 
        //Add two input fields for taking two numbers as input.
        //Create four buttons — Add, Subtract, Multiply, and Divide.
        //When the user clicks any button, perform the corresponding operation on
        //the two input values and display the result below the buttons. 

        function add(){
            num1= document.getElementById("num1").value
            num2= document.getElementById("num2").value
            result = num1 + num2
            document.write.getElementById("result").innerHTML = result
        }


    </script>
